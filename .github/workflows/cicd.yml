name: Build, Test, and Deploy

on:
  push:
    branches: [ MCA_Project ]
  pull_request:
    branches: [ MCA_Project ]

jobs:
  # =================================
  # Stage 1: Build the application
  # =================================
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run dependency security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # =================================================
  # Stage 2: Run Cypress tests via Docker Compose
  # (self-hosted-style: builds and runs the app + Cypress as containers)
  # =================================================
  test-docker-local:
    name: E2E Tests (Docker Compose)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run tests using Docker Compose
        run: |
          # Run the app and cypress containers, execute tests, and then shut them down.
          # The `--exit-code-from cypress` flag makes the command exit with the status of the cypress container.
          docker-compose -f docker-compose.ci.yml run --rm cypress

      - name: Upload Cypress artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore

  # =================================================
  # Stage 3: Deploy to a target environment
  # =================================================
  deploy:
    name: Deploy to Vercel
    needs: [build, test-docker-local]
    runs-on: ubuntu-latest
    # This job only runs on pushes to the MCA_Project branch, not on pull requests.
    if: github.ref == 'refs/heads/MCA_Project' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel Production
        run: vercel deploy --prebuilt --prod --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
